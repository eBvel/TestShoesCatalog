[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "3.12.7"


[tool.poetry.group.test.dependencies]
pytest = "^9.2.0"
selenium = "^4.52.0"
webdriver-manager = "^4.1.2"
allure-pytest = "^2.16.2"
faker = "^40.44.0"

[tool.poetry.group.lint.dependencies]
pre-commit = "^4.7.0"
ruff = "^0.17.3"
mypy = "^2.4.1"


[tool.pytest]
minversion = "9.0"
addopts = ["-sv", "--tb=short"]
testpaths = [
    "tests"
]
markers = [
    "smoke: testing the basic functionality",
    "slow: marks test as slow-running tests",
    "flaky: marks tests that are intermittently failing"
]


[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
strict = true
pretty = true
ignore_missing_imports = true
exclude = [
    ".idea/",
	".venv/"
]


[tool.ruff]
target-version = "py312"
exclude = [
	".idea",
	".venv",
	"venv",
	"__pycache__"
]
fix = true
line-length = 79

[tool.ruff.lint]
select = [
	"E",
	"W",
	"F",
	"I",
	"C90",
	"PL"
]
ignore = [
	"E501",
	"PLR0913",
	"W292",
	"W191"
]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-line-length = 72